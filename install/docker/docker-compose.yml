# =============================================================================
# OpenFang Agent OS — Docker Compose
# =============================================================================
#
# QUICK START
# -----------
#   cd install/docker
#   cp .env.example .env
#   # Edit .env — set OPENFANG_STATE_PATH and at least one LLM API key
#   docker compose up -d --build
#   curl http://localhost:${OPENFANG_PORT:-4200}/api/health
#
# PERSISTENT STATE
# ----------------
# All OpenFang state (config, SQLite DB, agents, skills) is stored on the host
# under OPENFANG_STATE_PATH (see .env).  The host path is mounted as /data
# inside the container and OPENFANG_HOME is set to /data.
#
#   ${OPENFANG_STATE_PATH}/
#   ├── config.toml            ← OpenFang configuration
#   ├── data/
#   │   └── openfang.db        ← SQLite memory / sessions / usage
#   ├── agents/                ← Agent manifests
#   └── skills/                ← Installed skills
#
# To pre-configure OpenFang, place a config.toml in OPENFANG_STATE_PATH before
# first boot.  On first run the directory is created automatically if absent.
#
# SHARED NETWORK
# --------------
# The service joins the "${AGENT_NETWORK}" bridge network (default: agent-phi).
# Other containers (qmd, paperclip, additional agent runtimes, etc.) can reach
# OpenFang at http://openfang:4200 by attaching to the same network:
#
#   # In another docker-compose.yml:
#   networks:
#     agent-net:
#       name: agent-phi    # must match AGENT_NETWORK in your .env
#       external: true
#
# The network is created by this compose file.  Set its name once via
# AGENT_NETWORK in .env so every stack in the ecosystem agrees on the name.
#
# =============================================================================

name: openfang

networks:
  # Shared bridge network for the entire agent-phi ecosystem.
  # All co-located services (qmd, paperclip, etc.) should join this network.
  agent-net:
    name: ${AGENT_NETWORK:-agent-phi}
    driver: bridge

services:
  openfang:
    # Build from source (repo root contains the Dockerfile).
    build:
      context: ../..
      dockerfile: Dockerfile
    image: openfang:local
    container_name: openfang

    restart: unless-stopped

    # ── Ports ────────────────────────────────────────────────────────────────
    # HOST_PORT:CONTAINER_PORT  — container always binds on 4200 internally.
    ports:
      - "${OPENFANG_PORT:-4200}:4200"

    # ── Persistent volumes ────────────────────────────────────────────────────
    # Host path (OPENFANG_STATE_PATH) → /data inside the container.
    # The directory is created on the host if it does not already exist.
    volumes:
      - type: bind
        source: ${OPENFANG_STATE_PATH:-~/agent-phi/state/openfang}
        target: /data
        bind:
          create_host_path: true

    # ── Environment ───────────────────────────────────────────────────────────
    environment:
      # Tell OpenFang where its home directory is inside the container.
      OPENFANG_HOME: /data

      # Runtime settings — override in .env as needed.
      RUST_LOG: ${OPENFANG_LOG_LEVEL:-info}

      # LLM provider keys — pulled from .env on the host.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}

      # Web search keys (optional).
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}

      # Channel adapter tokens (optional — enable the channel in config.toml).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      MATRIX_ACCESS_TOKEN: ${MATRIX_ACCESS_TOKEN:-}
      TEAMS_APP_PASSWORD: ${TEAMS_APP_PASSWORD:-}
      MATTERMOST_TOKEN: ${MATTERMOST_TOKEN:-}

    # ── Health check ─────────────────────────────────────────────────────────
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4200/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    # ── Network ───────────────────────────────────────────────────────────────
    # Join the shared ecosystem network so peer services can reach OpenFang
    # at http://openfang:4200 without exposing the port to the host.
    networks:
      - agent-net
